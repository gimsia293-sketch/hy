<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바보 ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #ffe6f0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* 하트 비 */
.rain-heart {
    position: fixed;
    top: -50px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 1;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

/* 가운데 */
.container {
    position: relative;
    z-index: 10;
    text-align: center;
}

#heart {
    border: 0;
    background: transparent;
    font-size: 120px;
    cursor: pointer;
    transition: transform 0.15s;
}

#heart:hover {
    transform: scale(1.12);
}

#heart:active {
    transform: scale(0.9);
}

#text {
    display: none;
    margin-top: 5px;
    font-size: 75px;
    font-weight: bold;
    color: #ff4f81;
    animation: pop 0.4s ease-out;
}

@keyframes pop {
    0% {
        transform: scale(0);
    }

    70% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }
}

/* 터지는 하트 */
.pop-heart {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    font-size: 30px;
    animation: popHeart 1s ease-out forwards;
}

@keyframes popHeart {
    0% {
        transform: translate(0, 0) scale(0.5);
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(var(--x) * 1px),
                calc(var(--y) * 1px)
            )
            rotate(360deg)
            scale(1.3);
        opacity: 0;
    }
}

/* 클릭 후 화면 살짝 핑크 */
.flash {
    animation: flash 0.25s;
}

@keyframes flash {
    50% {
        background: #ffd0e1;
    }
}
</style>
</head>

<body>

<div class="container">
    <button id="heart">❤️</button>
    <div id="text">바보</div>
</div>

<script>
const heart = document.getElementById("heart");
const text = document.getElementById("text");

/* 하트 비 */
function createRainHeart() {
    const h = document.createElement("div");

    h.className = "rain-heart";
    h.innerText = Math.random() > 0.5 ? "❤️" : "💕";

    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (15 + Math.random() * 30) + "px";
    h.style.animationDuration = (2 + Math.random() * 4) + "s";

    document.body.appendChild(h);

    setTimeout(() => {
        h.remove();
    }, 7000);
}

setInterval(createRainHeart, 130);


/* 하트 클릭 */
heart.addEventListener("click", function() {

    text.style.display = "block";

    // 화면 효과
    document.body.classList.remove("flash");
    void document.body.offsetWidth;
    document.body.classList.add("flash");

    // 하트 팡!
    for (let i = 0; i < 30; i++) {
        createPopHeart();
    }
});


/* 하트 폭발 */
function createPopHeart() {
    const h = document.createElement("div");

    h.className = "pop-heart";
    h.innerText = Math.random() > 0.5 ? "❤️" : "💕";

    // 가운데에서 시작
    h.style.left = "50%";
    h.style.top = "50%";

    // 사방으로 퍼지기
    const angle = Math.random() * Math.PI * 2;
    const distance = 100 + Math.random() * 250;

    h.style.setProperty(
        "--x",
        Math.cos(angle) * distance
    );

    h.style.setProperty(
        "--y",
        Math.sin(angle) * distance
    );

    h.style.fontSize = (18 + Math.random() * 25) + "px";

    document.body.appendChild(h);

    setTimeout(() => {
        h.remove();
    }, 1000);
}
</script>

</body>
</html>
